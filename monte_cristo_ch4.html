        {en: "'Now, see, my son,' told Edmond. 'A man may lose his freedom, but he must never lose his mind. That is the true prison.'", ar: "'الآن، انظر يا بني،' قال إدموند. 'قد يفقد الرجل حريته، لكن لا يجب أن يفقد عقله أبداً. هذا هو السجن الحقيقي.'"},
        {en: "Edmond listened with awe. He had been a sailor, skilled at reading the winds and the waves, but untrained in books. Now, locked in darkness, he found a teacher who could open doors in his mind wider than the ocean itself.", ar: "استمع إدموند بذهول. لقد كان بحاراً، ماهراً في قراءة الرياح والأمواج، لكنه غير مدرب على الكتب. الآن، محبوساً في الظلام، وجد مدرساً يمكنه أن يفتح أبواباً في عقله أوسع من المحيط نفسه."},
        {en: "Edmond's heart filled with gratitude. 'I thought I would die alone. You have saved me.'", ar: "امتلأ قلب إدموند بالامتنان. 'ظننت أنني سأموت وحيداً. لقد أنقذتني.'"},
        {en: "The abbé smiled kindly. 'No, my son. Perhaps it is you who will save me. Together, we may yet find freedom.'", ar: "ابتسم الأب بلطف. 'لا يا بني. ربما يكون أنت من سينقذني. معاً، قد نجد الحرية.'"},
        {en: "Day after day, the two prisoners widened the passage, crawling through to spend hours together. The guards suspected nothing, for Edmond and the abbé were careful to hide their work.", ar: "يومًا بعد يوم، وسع السجينان الممر، يزحفان عبره ليقضيا ساعات معاً. لم يشك الحراس في شيء، لأن إدموند والأب كانا حريصين على إخفاء عملهما."},
        {en: "Lessons in the Darkness", ar: "دروس في الظلام"},
        {en: "More than freedom, Abbé Faria gave Edmond something greater: knowledge. The priest had studied history, philosophy, and science. He had studied politics, science, and human nature. Now, in the silence of the prison, he shared his wisdom with Edmond.", ar: "أكثر من الحرية، أعطى الأب فاريا إدموند شيئاً أعظم: المعرفة. درس الكاهن التاريخ والفلسفة والعلوم. لقد درس السياسة والعلوم والطبيعة البشرية. الآن، في صمت السجن، شارك حكمته مع إدموند."},
        {en: "'Since we cannot live free,' the abbé said, 'let us at least live usefully. Each day, I will teach, and you will learn.'", ar: "'بما أننا لا نستطيع العيش أحراراً،' قال الأب، 'فلنعيش على الأقل بشكل مفيد. كل يوم، سأعلم، وسوف تتعلم.'"},
        {en: "So Edmond became his student. He learned Italian, English, and even some Arabic. He studied history and geography, science and strategy. His mind, once simple and youthful, grew sharp and disciplined.", ar: "وهكذا أصبح إدموند تلميذه. تعلم الإيطالية والإنجليزية وحتى بعض العربية. درس التاريخ والجغرافيا والعلوم والاستراتيجية. عقله، الذي كان بسيطاً وشاباً، أصبح حاداً ومنضبطاً."},
        {en: "'I entered this prison a sailor,' Edmond thought, 'but I will leave it a scholar.'", ar: "'لقد دخلت هذا السجن بحاراً،' فكر إدموند، 'لكنني سأغادره عالماً.'"},
        {en: "The Story of the Treasure", ar: "قصة الكنز"},
        {en: "One night, as the two men whispered in the tunnel, the abbé grew serious. 'There is something more, Edmond, something I have never told another soul. If fate wills it, this secret may one day save you.'", ar: "في إحدى الليالي، بينما كان الرجلان يهمسان في النفق، أصبح الأب جاداً. 'هناك شيء آخر يا إدموند، شيء لم أخبر به أي روح أخرى. إذا شاء القدر، قد ينقذك هذا السر يوماً ما.'"},
        {en: "He leaned close and revealed the story of a vast treasure hidden on the island of Monte Cristo. He told of a map, of riches beyond imagination—gold, jewels, and priceless artifacts, concealed long ago by the Spada family.", ar: "اقترب وكشف عن قصة كنز هائل مخبأ في جزيرة مونت كريستو. تحدث عن خريطة، عن ثروات تفوق الخيال - ذهب، وجواهر، وقطع أثرية لا تقدر بثمن، أخفتها عائلة سبادا منذ زمن طويل."},
        {en: "At first, Edmond thought it was a dream. 'Such a fortune cannot be real.'", ar: "في البداية، ظن إدموند أنها حلم. 'مثل هذه الثروة لا يمكن أن تكون حقيقية.'"},
        {en: "The abbé smiled. 'I assure you, it is real. And if ever you escape this prison, the treasure shall be yours. Promise me that you will use it wisely, not for greed, but for justice.'", ar: "ابتسم الأب. 'أؤكد لك، إنها حقيقية. وإذا هربت من هذا السجن يوماً ما، سيكون الكنز لك. عِدني بأنك ستستخدمه بحكمة، ليس من أجل الجشع، بل من أجل العدالة.'"},
        {en: "Edmond's heart burned. For the first time since his arrest, he saw a future—not as a broken prisoner, but as a man with the power to change his fate.", ar: "احترق قلب إدموند. للمرة الأولى منذ اعتقاله، رأى مستقبلاً - ليس كسجين محطم، بل كرجل لديه القدرة على تغيير مصيره."},
        {en: "Sickness and Despair", ar: "المرض واليأس"},
        {en: "The abbé suffered from terrible seizures, violent fits that shook his body and left him weak for days. He knew his time was short.", ar: "عانى الأب من نوبات رهيبة، تشنجات عنيفة هزت جسده وتركته ضعيفاً لأيام. عرف أن وقته قصير."},
        {en: "'My dear Edmond,' he whispered during one of these attacks, 'if I die before we escape, the secret of the treasure is yours. Here, I have drawn the map. Take it. Remember Monte Cristo.'", ar: "'عزيزي إدموند،' همس خلال إحدى هذه النوبات، 'إذا مت قبل أن نهرب، فإن سر الكنز لك. هنا، لقد رسمت الخريطة. خذها. تذكر مونت كريستو.'"},
        {en: "Edmond's heart burned. 'No, Father. You will live. Together we shall escape.'", ar: "احترق قلب إدموند. 'لا يا أبي. ستعيش. معاً سنهرب.'"},
        {en: "But in his heart, he feared otherwise.", ar: "لكن في قلبه، كان يخشى خلاف ذلك."}
    ]
}
];

// ===================== بناء الواجهة =====================
function makeWordSpans(text) {
    const words = text.trim().split(/\s+/);
    return words.map((w, idx) => `<span class="word" data-word-index="${idx}">${w}</span>`).join(' ');
}

function buildAllSections() {
    const container = document.getElementById('sections-container');

    function makePills(wordsArray, sectionId) {
        return wordsArray.map((w, i) => {
            const id = `${sectionId}_p${i}`;
            const wordHtml = makeWordSpans(w[0]);
            const speakText = cleanForSpeech(w[0]);
            return `<div class="pill" id="${id}" data-speak="${speakText}" onclick="playOne('${id}')"><span class="en">${wordHtml}</span><span class="tr">${w[1]}</span></div>`;
        }).join('');
    }

    function makeRuleItem(icon, sectionId, index, speakText, arText, displayText) {
        const id = `${sectionId}_${index}`;
        const wordHtml = makeWordSpans(displayText || speakText);
        const finalSpeak = cleanForSpeech(speakText);
        return `<div class="rule-item" id="${id}" data-speak="${finalSpeak}" onclick="playOne('${id}')">
            <span class="rule-icon">${icon}</span>
            <div class="rule-text">
                <span class="en">${wordHtml}</span>
                <span class="ar">${arText || ''}</span>
            </div>
        </div>`;
    }

    function playBar(sectionId) {
        return `<div class="sec-play-bar">
            <button class="big-btn" style="background:linear-gradient(135deg,var(--A),var(--A2))" onclick="playSection('${sectionId}')">▶ Play</button>
            <button class="big-btn pause-btn" onclick="pauseAll()">⏸ Pause</button>
            <button class="big-btn stop-btn" onclick="stopAll()">⏹ Stop</button>
        </div>`;
    }

    function isSubHeading(text) {
        // Short standalone lines with no ending punctuation are treated as section headings
        return text.trim().split(/\s+/).length <= 5 && !/[.!?']$/.test(text.trim());
    }

    function makeStorySection(sectionId, storyData) {
        return `<div class="story-card">
            ${storyData.map((s, i) => {
                const id = `${sectionId}_s${i}`;
                const heading = isSubHeading(s.en);
                const wordHtml = makeWordSpans(s.en);
                const cls = heading ? 'sentence sub-heading' : 'sentence';
                return `<div class="${cls}" id="${id}" data-speak="${cleanForSpeech(s.en)}" onclick="playOne('${id}')">${wordHtml}</div>`;
            }).join('')}
            <div class="story-ar">${storyData.map(s => s.ar).join(' ')}</div>
        </div>`;
    }

    let html = '';

    chaptersData.forEach(ch => {
        const vocabId = `secVocabCh${ch.number}`;
        const defId = `secDefCh${ch.number}`;

        // Chapter divider
        html += `<div class="chapter-divider"><h2>Chapter ${ch.number}</h2><p>${ch.title}</p></div>`;

        // Vocabulary section
        html += `<div class="section-block" id="${vocabId}">
            <div class="sec-title">📚 Vocabulary — Chapter ${ch.number}</div>
            <div class="sec-body">
                ${playBar(vocabId)}
                <div class="info-box">
                    <div class="info-title">Key Vocabulary</div>
                    <div class="vocab">${makePills(ch.vocab, vocabId)}</div>
                </div>
            </div>
        </div>`;

        // Definitions section
        html += `<div class="section-block" id="${defId}">
            <div class="sec-title">📝 Definitions — Chapter ${ch.number}</div>
            <div class="sec-body">
                ${playBar(defId)}
                <div class="rules-grid">${ch.definitions.map((d, i) => {
                    const speakText = cleanForSpeech(d.word) + " | " + d.def;
                    return makeRuleItem('📖', defId, i, speakText, d.def, d.word);
                }).join('')}</div>
            </div>
        </div>`;

        // Story text section (only if this chapter has story data)
        if (ch.story && ch.story.length > 0) {
            const storyId = `secStoryCh${ch.number}`;
            html += `<div class="section-block" id="${storyId}">
                <div class="sec-title">📖 Reading Text — Chapter ${ch.number}</div>
                <div class="sec-body">
                    ${playBar(storyId)}
                    ${makeStorySection(storyId, ch.story)}
                </div>
            </div>`;
        }
    });

    container.innerHTML = html;
}

// ===================== نظام الصوت =====================
const rateRange = document.getElementById('rateRange');
const rateBadge = document.getElementById('rateBadge');
const fabPause = document.getElementById('fabPause');

const savedRate = localStorage.getItem('speechRate') || 1;
rateRange.value = savedRate;
rateBadge.textContent = parseFloat(savedRate).toFixed(1)+'x';
rateRange.addEventListener('input', () => {
    const val = parseFloat(rateRange.value).toFixed(1);
    rateBadge.textContent = val+'x';
    localStorage.setItem('speechRate', val);
});

let voices = [];
function loadVoices() {
    voices = window.speechSynthesis.getVoices();
    populateVoiceSelect();
}
function populateVoiceSelect() {
    const vs = document.getElementById('voiceSelect');
    const note = document.getElementById('voiceNote');
    const allVoices = voices;
    if (!allVoices.length) return;
    const normalizeLang = (lang) => lang.replace('_', '-');
    const isLangMatch = (voiceLang, targetPrefix) => normalizeLang(voiceLang) === targetPrefix || normalizeLang(voiceLang).startsWith(targetPrefix + '-');
    const usVoice = allVoices.find(v => isLangMatch(v.lang, 'en-US'));
    const gbVoice = allVoices.find(v => isLangMatch(v.lang, 'en-GB'));
    const options = [];
    if (usVoice) options.push({ label: '🇺🇸 American', uri: usVoice.voiceURI });
    if (gbVoice) options.push({ label: '🇬🇧 British', uri: gbVoice.voiceURI });
    if (!options.length) {
        note.textContent = '⚠️ No US/UK voice found.';
        const anyEn = allVoices.filter(v => v.lang.startsWith('en')).slice(0,2);
        anyEn.forEach(v => options.push({ label: v.name + ' ('+v.lang+')', uri: v.voiceURI }));
    } else {
        note.textContent = '';
    }
    const savedURI = localStorage.getItem('voiceURI');
    vs.innerHTML = options.map(o => `<option value="${o.uri}">${o.label}</option>`).join('');
    if (savedURI && options.some(o => o.uri === savedURI)) vs.value = savedURI;
}
document.getElementById('voiceSelect').addEventListener('change', function() {
    localStorage.setItem('voiceURI', this.value);
});

function getSelectedVoice() {
    const uri = localStorage.getItem('voiceURI');
    return voices.find(v => v.voiceURI === uri) || null;
}

window._q = []; window._qi = 0;
window._currentUtterance = null;
let currentHighlightedId = null;

function clearAllHighlights() {
    document.querySelectorAll('.active-sent').forEach(e => e.classList.remove('active-sent'));
    currentHighlightedId = null;
}
function showFab(show) { if (show) fabPause.classList.add('show'); else fabPause.classList.remove('show'); }
function updateFabIcon() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) fabPause.innerHTML = '⏸️';
    else if (window.speechSynthesis.paused) fabPause.innerHTML = '▶️';
    else fabPause.innerHTML = '⏯️';
}

function playQueue() {
    if (window._qi >= window._q.length) {
        clearAllHighlights(); showFab(false); return;
    }
    const item = window._q[window._qi];
    if (currentHighlightedId !== item.id) {
        clearAllHighlights();
        const el = document.getElementById(item.id);
        if (el) {
            el.classList.add('active-sent');
            el.scrollIntoView({behavior:'smooth',block:'nearest'});
            currentHighlightedId = item.id;
        }
    }
    const u = new SpeechSynthesisUtterance(item.text);
    u.rate = parseFloat(rateRange.value) || 1;
    const voice = getSelectedVoice();
    if (voice) u.voice = voice;

    u.onstart = () => { showFab(true); updateFabIcon(); };
    u.onend = function() { window._qi++; playQueue(); };
    u.onerror = function(e) { console.warn('Speech error', e); window._qi++; playQueue(); };
    u.onpause = () => updateFabIcon();
    u.onresume = () => updateFabIcon();

    window._currentUtterance = u;
    window.speechSynthesis.speak(u);
}

function splitAndQueue(textParts, id) {
    textParts.forEach((p) => { const trimmed = p.trim(); if (trimmed) window._q.push({id: id, text: trimmed}); });
}

function playSection(secId) {
    stopAll();
    const sec = document.getElementById(secId);
    const els = [...sec.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        const text = el.dataset.speak;
        const parts = text.split('|').map(p => p.trim());
        splitAndQueue(parts, el.id);
    });
    window._qi = 0;
    playQueue();
}

function playAll() {
    stopAll();
    const els = [...document.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        const text = el.dataset.speak;
        const parts = text.split('|').map(p => p.trim());
        splitAndQueue(parts, el.id);
    });
    window._qi = 0;
    playQueue();
}

function playOne(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const text = el.dataset.speak;
    stopAll();
    const parts = text.split('|').map(p => p.trim());
    splitAndQueue(parts, id);
    window._qi = 0;
    playQueue();
}

function pauseAll() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
        window.speechSynthesis.pause(); updateFabIcon();
    } else if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume(); updateFabIcon();
    }
}

function stopAll() {
    window._q = []; window._qi = 0;
    clearAllHighlights();
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    showFab(false);
}

function toggleFabPause() { pauseAll(); }

// ===================== الثيمات =====================
function setTheme(theme, btn) {
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    localStorage.setItem('theme', theme);
}
const savedTheme = localStorage.getItem('theme') || 'teal';
document.documentElement.setAttribute('data-theme', savedTheme);
document.querySelectorAll('.theme-btn').forEach(b => {
    if (b.classList.contains('t-'+savedTheme)) b.classList.add('active');
});

// ===================== بدء التشغيل =====================
buildAllSections();
loadVoices();
setTimeout(loadVoices, 300);
setTimeout(loadVoices, 1000);
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
</script>
