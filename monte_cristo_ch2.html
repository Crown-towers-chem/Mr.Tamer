        {en: "Villefort's voice grew cold. 'Edmond Dantès, you have confessed to carrying a letter from the enemy of the king. For this, you are guilty of treason. Guards, take him to the Château d'If!'", ar: "صار صوت فيلفور بارداً. 'إدموند دانتيس، لقد اعترفت بحمل رسالة من عدو الملك. لهذا، أنت مذنب بالخيانة. أيها الحراس، خذوه إلى شاتو دي إف!'"},
        {en: "'No!' Edmond cried. 'I am innocent! Please, listen to me—' But his words were drowned by the clanging of the prison doors.", ar: "'لا!' صرخ إدموند. 'أنا بريء! أرجوك، استمع إليَّ—' لكن كلماته غرقت في قرقعة أبواب السجن."},
        {en: "Reactions in Marseille", ar: "ردود الفعل في مرسيليا"},
        {en: "Within hours, news spread that Edmond had been imprisoned, shock and disbelief filled Marseille. Mercédès refused to believe it. She went from door to door, pleading with officials, crying out that Edmond was no traitor. 'He knows only ships, sails, and the sea,' she said desperately.", ar: "في غضون ساعات، انتشرت أخبار أن إدموند قد تم سجنه، وملأت الصدمة وعدم التصديق مرسيليا. رفضت مرسيدس تصديق ذلك. ذهبت من باب إلى باب، متوسلة إلى المسؤولين، صارخة بأن إدموند ليس خائناً. 'لا يعرف إلا السفن والأشرعة والبحر'، قالت بيأس."},
        {en: "But her cries fell on deaf ears. The government was afraid of Napoleon's return, and any man accused of serving him was guilty in their eyes.", ar: "لكن صراخها وقع على آذان صماء. كانت الحكومة خائفة من عودة نابليون، وأي رجل متهم بخدمته كان مذنباً في أعينهم."},
        {en: "Edmond's father grew weaker with grief. He had only his son in the world, and now even that comfort had been taken from him. He sat for hours by the window, staring at the sea, whispering Edmond's name.", ar: "ضعف والد إدموند من شدة الحزن. لم يكن له سوى ابنه في العالم، والآن حتى هذه الراحة قد أُخذت منه. جلس لساعات بجانب النافذة، محدقاً في البحر، ويهمس باسم إدموند."},
        {en: "Meanwhile, Danglars and Fernand celebrated quietly. Danglars smiled to himself, imagining the Pharaon under his influence now that Edmond was gone. Fernand, though, could only think of Mercédès. He visited her daily, pretending to comfort her, but secretly hoping her despair would push her into his arms. Yet each time, Mercédès turned away, her loyalty to Edmond unshaken.", ar: "في هذه الأثناء، احتفل دانغلار وفيرناند بهدوء. ابتسم دانغلار في نفسه، متخيلاً الفرعون تحت نفوذه الآن بعد أن رحل إدموند. أما فيرناند، فلم يستطع إلا التفكير في مرسيدس. زارها يومياً، متظاهراً بمواساتها، لكنه كان يأمل سراً أن يدفعها يأسها بين ذراعيه. لكن في كل مرة، كانت مرسيدس تبتعد عنه، وولاؤها لإدموند ثابت."},
        {en: "'I will wait for him,' she said firmly. 'If he is in prison for a hundred years, still I will wait.'", ar: "'سأنتظره،' قالت بحزم. 'إذا كان في السجن مائة عام، سأنتظره.'"},
        {en: "Her words cut Fernand's heart like a knife.", ar: "قطعت كلماتها قلب فيرناند كالسكين."},
        {en: "Villefort's Secret", ar: "سر فيلفور"},
        {en: "That night, Villefort sat in his study, the letter spread before him. His hands shook as he read his father's name once again. It was no secret that Gérard de Villefort's father was a traitor, all his dreams of power would collapse.", ar: "في تلك الليلة، جلس فيلفور في دراسته، والرسالة منتشرة أمامه. ارتجفت يداه وهو يقرأ اسم والده مرة أخرى. لم يكن سراً أن والد جيرارد دو فيلفور كان خائناً، وكل أحلامه في السلطة ستنهار."},
        {en: "His fiancée's family was royalist, his own career depended on loyalty to the crown. Everything he had worked for could vanish in an instant.", ar: "كانت عائلة خطيبته ملكية، وتعتمد مسيرته المهنية على الولاء للتاج. كل شيء عمل من أجله يمكن أن يختفي في لحظة."},
        {en: "Without moving, Villefort lifted the letter. With cold determination, he threw the letter into the fire. The flames consumed the paper, turning it into ash.", ar: "بدون حراك، رفع فيلفور الرسالة. بعزيمة باردة، ألقى الرسالة في النار. ألهبت النيران الورق، وحولته إلى رماد."},
        {en: "Then he whispered, 'Farewell, Edmond Dantès. You are sacrificed for my future.'", ar: "ثم همس، 'وداعاً يا إدموند دانتيس. لقد تم التضحية بك من أجل مستقبلي.'"},
        {en: "The Journey to the Château d'If", ar: "الرحلة إلى شاتو دي إف"},
        {en: "At dawn, soldiers dragged Edmond from his cell. Shackled and pale, he was pushed into a small boat which carried him across the waters of Marseille. He looked desperately at the city—the port where he had dreamed of being captain, the house where his father waited, the streets where he had walked with Mercédès. Every sight pierced his heart like a blade.", ar: "عند الفجر، سحب الجنود إدموند من زنزانته. مقيداً بالسلاسل وشاحباً، تم دفعه إلى قارب صغير حمله عبر مياه مرسيليا. نظر بيأس إلى المدينة - الميناء حيث حلم بأن يكون قبطاناً، والمنزل حيث انتظر والده، والشوارع التي سار فيها مع مرسيدس. كل مشهد طعن قلبه كالنصل."},
        {en: "'Where are you taking me?' he cried.", ar: "'إلى أين تأخذونني؟' صرخ."},
        {en: "'To the Château d'If,' one guard replied grimly.", ar: "'إلى شاتو دي إف'، أجاب أحد الحراس بوجه عبوس."},
        {en: "Edmond's blood turned cold. The Château d'If was a fortress-prison built on a rocky island, infamous for housing traitors and prisoners. Few who entered its gates ever returned.", ar: "تجمد دم إدموند. كان شاتو دي إف سجناً حصيناً بني على جزيرة صخرية، سيئ السمعة لاحتوائه على الخونة والسجناء. قلة هم الذين دخلوا بواباته وعادوا."},
        {en: "As the boat approached the dark stone walls rising from the sea, Edmond's spirit sank. He stretched out his hands toward the city, shouting, 'Mercédès! Father! Help me!' But no voice answered, only the crash of the waves against the rocks.", ar: "مع اقتراب القارب من الجدران الحجرية المظلمة الناشئة من البحر، غرقت روح إدموند. مدّ يديه نحو المدينة، صارخاً، 'مرسيدس! أبي! ساعدوني!' لكن لم يجب أي صوت، سوى ارتطام الأمواج بالصخور."},
        {en: "As the doors of the prison shut, he felt the world of freedom and love slip away, leaving only hollow pain within him.", ar: "عندما أغلقت أبواب السجن، شعر بعالم الحرية والحب يتلاشى، تاركاً وراءه ألماً أجوفاً فقط."},
        {en: "The Plot Completed", ar: "إكمال المؤامرة"},
        {en: "Back in Marseille, Danglars and Fernand exchanged satisfied glances. 'The plan worked,' Danglars said, chuckling grimly.", ar: "عودة إلى مرسيليا، تبادل دانغلار وفيرناند نظرات رضا. 'الخطة نجحت'، قال دانغلار، ضاحكاً بمرارة."},
        {en: "Fernand nodded, his eyes fixed on Mercédès from a distance. 'Yes, gone. And now she will be mine.'", ar: "أومأ فيرناند برأسه، وعيناه مثبتتان على مرسيدس من بعيد. 'نعم، لقد رحل. والآن ستكون لي.'"},
        {en: "But if Danglars and Fernand knew the truth—that Edmond was imprisoned, his spirit lived on in the heart of Mercédès, and no chains could break that bond.", ar: "لكن إذا كان دانغلار وفيرناند يعرفان الحقيقة - أن إدموند كان مسجوناً، كانت روحه لا تزال حية في قلب مرسيدس، ولا قيود يمكنها كسر تلك الرابطة."}
    ]
}
];

// ===================== بناء الواجهة =====================
function makeWordSpans(text) {
    const words = text.trim().split(/\s+/);
    return words.map((w, idx) => `<span class="word" data-word-index="${idx}">${w}</span>`).join(' ');
}

function buildAllSections() {
    const container = document.getElementById('sections-container');

    function makePills(wordsArray, sectionId) {
        return wordsArray.map((w, i) => {
            const id = `${sectionId}_p${i}`;
            const wordHtml = makeWordSpans(w[0]);
            const speakText = cleanForSpeech(w[0]);
            return `<div class="pill" id="${id}" data-speak="${speakText}" onclick="playOne('${id}')"><span class="en">${wordHtml}</span><span class="tr">${w[1]}</span></div>`;
        }).join('');
    }

    function makeRuleItem(icon, sectionId, index, speakText, arText, displayText) {
        const id = `${sectionId}_${index}`;
        const wordHtml = makeWordSpans(displayText || speakText);
        const finalSpeak = cleanForSpeech(speakText);
        return `<div class="rule-item" id="${id}" data-speak="${finalSpeak}" onclick="playOne('${id}')">
            <span class="rule-icon">${icon}</span>
            <div class="rule-text">
                <span class="en">${wordHtml}</span>
                <span class="ar">${arText || ''}</span>
            </div>
        </div>`;
    }

    function playBar(sectionId) {
        return `<div class="sec-play-bar">
            <button class="big-btn" style="background:linear-gradient(135deg,var(--A),var(--A2))" onclick="playSection('${sectionId}')">▶ Play</button>
            <button class="big-btn pause-btn" onclick="pauseAll()">⏸ Pause</button>
            <button class="big-btn stop-btn" onclick="stopAll()">⏹ Stop</button>
        </div>`;
    }

    function isSubHeading(text) {
        // Short standalone lines with no ending punctuation are treated as section headings
        return text.trim().split(/\s+/).length <= 5 && !/[.!?']$/.test(text.trim());
    }

    function makeStorySection(sectionId, storyData) {
        return `<div class="story-card">
            ${storyData.map((s, i) => {
                const id = `${sectionId}_s${i}`;
                const heading = isSubHeading(s.en);
                const wordHtml = makeWordSpans(s.en);
                const cls = heading ? 'sentence sub-heading' : 'sentence';
                return `<div class="${cls}" id="${id}" data-speak="${cleanForSpeech(s.en)}" onclick="playOne('${id}')">${wordHtml}</div>`;
            }).join('')}
            <div class="story-ar">${storyData.map(s => s.ar).join(' ')}</div>
        </div>`;
    }

    let html = '';

    chaptersData.forEach(ch => {
        const vocabId = `secVocabCh${ch.number}`;
        const defId = `secDefCh${ch.number}`;

        // Chapter divider
        html += `<div class="chapter-divider"><h2>Chapter ${ch.number}</h2><p>${ch.title}</p></div>`;

        // Vocabulary section
        html += `<div class="section-block" id="${vocabId}">
            <div class="sec-title">📚 Vocabulary — Chapter ${ch.number}</div>
            <div class="sec-body">
                ${playBar(vocabId)}
                <div class="info-box">
                    <div class="info-title">Key Vocabulary</div>
                    <div class="vocab">${makePills(ch.vocab, vocabId)}</div>
                </div>
            </div>
        </div>`;

        // Definitions section
        html += `<div class="section-block" id="${defId}">
            <div class="sec-title">📝 Definitions — Chapter ${ch.number}</div>
            <div class="sec-body">
                ${playBar(defId)}
                <div class="rules-grid">${ch.definitions.map((d, i) => {
                    const speakText = cleanForSpeech(d.word) + " | " + d.def;
                    return makeRuleItem('📖', defId, i, speakText, d.def, d.word);
                }).join('')}</div>
            </div>
        </div>`;

        // Story text section (only if this chapter has story data)
        if (ch.story && ch.story.length > 0) {
            const storyId = `secStoryCh${ch.number}`;
            html += `<div class="section-block" id="${storyId}">
                <div class="sec-title">📖 Reading Text — Chapter ${ch.number}</div>
                <div class="sec-body">
                    ${playBar(storyId)}
                    ${makeStorySection(storyId, ch.story)}
                </div>
            </div>`;
        }
    });

    container.innerHTML = html;
}

// ===================== نظام الصوت =====================
const rateRange = document.getElementById('rateRange');
const rateBadge = document.getElementById('rateBadge');
const fabPause = document.getElementById('fabPause');

const savedRate = localStorage.getItem('speechRate') || 1;
rateRange.value = savedRate;
rateBadge.textContent = parseFloat(savedRate).toFixed(1)+'x';
rateRange.addEventListener('input', () => {
    const val = parseFloat(rateRange.value).toFixed(1);
    rateBadge.textContent = val+'x';
    localStorage.setItem('speechRate', val);
});

let voices = [];
function loadVoices() {
    voices = window.speechSynthesis.getVoices();
    populateVoiceSelect();
}
function populateVoiceSelect() {
    const vs = document.getElementById('voiceSelect');
    const note = document.getElementById('voiceNote');
    const allVoices = voices;
    if (!allVoices.length) return;
    const normalizeLang = (lang) => lang.replace('_', '-');
    const isLangMatch = (voiceLang, targetPrefix) => normalizeLang(voiceLang) === targetPrefix || normalizeLang(voiceLang).startsWith(targetPrefix + '-');
    const usVoice = allVoices.find(v => isLangMatch(v.lang, 'en-US'));
    const gbVoice = allVoices.find(v => isLangMatch(v.lang, 'en-GB'));
    const options = [];
    if (usVoice) options.push({ label: '🇺🇸 American', uri: usVoice.voiceURI });
    if (gbVoice) options.push({ label: '🇬🇧 British', uri: gbVoice.voiceURI });
    if (!options.length) {
        note.textContent = '⚠️ No US/UK voice found.';
        const anyEn = allVoices.filter(v => v.lang.startsWith('en')).slice(0,2);
        anyEn.forEach(v => options.push({ label: v.name + ' ('+v.lang+')', uri: v.voiceURI }));
    } else {
        note.textContent = '';
    }
    const savedURI = localStorage.getItem('voiceURI');
    vs.innerHTML = options.map(o => `<option value="${o.uri}">${o.label}</option>`).join('');
    if (savedURI && options.some(o => o.uri === savedURI)) vs.value = savedURI;
}
document.getElementById('voiceSelect').addEventListener('change', function() {
    localStorage.setItem('voiceURI', this.value);
});

function getSelectedVoice() {
    const uri = localStorage.getItem('voiceURI');
    return voices.find(v => v.voiceURI === uri) || null;
}

window._q = []; window._qi = 0;
window._currentUtterance = null;
let currentHighlightedId = null;

function clearAllHighlights() {
    document.querySelectorAll('.active-sent').forEach(e => e.classList.remove('active-sent'));
    currentHighlightedId = null;
}
function showFab(show) { if (show) fabPause.classList.add('show'); else fabPause.classList.remove('show'); }
function updateFabIcon() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) fabPause.innerHTML = '⏸️';
    else if (window.speechSynthesis.paused) fabPause.innerHTML = '▶️';
    else fabPause.innerHTML = '⏯️';
}

function playQueue() {
    if (window._qi >= window._q.length) {
        clearAllHighlights(); showFab(false); return;
    }
    const item = window._q[window._qi];
    if (currentHighlightedId !== item.id) {
        clearAllHighlights();
        const el = document.getElementById(item.id);
        if (el) {
            el.classList.add('active-sent');
            el.scrollIntoView({behavior:'smooth',block:'nearest'});
            currentHighlightedId = item.id;
        }
    }
    const u = new SpeechSynthesisUtterance(item.text);
    u.rate = parseFloat(rateRange.value) || 1;
    const voice = getSelectedVoice();
    if (voice) u.voice = voice;

    u.onstart = () => { showFab(true); updateFabIcon(); };
    u.onend = function() { window._qi++; playQueue(); };
    u.onerror = function(e) { console.warn('Speech error', e); window._qi++; playQueue(); };
    u.onpause = () => updateFabIcon();
    u.onresume = () => updateFabIcon();

    window._currentUtterance = u;
    window.speechSynthesis.speak(u);
}

function splitAndQueue(textParts, id) {
    textParts.forEach((p) => { const trimmed = p.trim(); if (trimmed) window._q.push({id: id, text: trimmed}); });
}

function playSection(secId) {
    stopAll();
    const sec = document.getElementById(secId);
    const els = [...sec.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        const text = el.dataset.speak;
        const parts = text.split('|').map(p => p.trim());
        splitAndQueue(parts, el.id);
    });
    window._qi = 0;
    playQueue();
}

function playAll() {
    stopAll();
    const els = [...document.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        const text = el.dataset.speak;
        const parts = text.split('|').map(p => p.trim());
        splitAndQueue(parts, el.id);
    });
    window._qi = 0;
    playQueue();
}

function playOne(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const text = el.dataset.speak;
    stopAll();
    const parts = text.split('|').map(p => p.trim());
    splitAndQueue(parts, id);
    window._qi = 0;
    playQueue();
}

function pauseAll() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
        window.speechSynthesis.pause(); updateFabIcon();
    } else if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume(); updateFabIcon();
    }
}

function stopAll() {
    window._q = []; window._qi = 0;
    clearAllHighlights();
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    showFab(false);
}

function toggleFabPause() { pauseAll(); }

// ===================== الثيمات =====================
function setTheme(theme, btn) {
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    localStorage.setItem('theme', theme);
}
const savedTheme = localStorage.getItem('theme') || 'teal';
document.documentElement.setAttribute('data-theme', savedTheme);
document.querySelectorAll('.theme-btn').forEach(b => {
    if (b.classList.contains('t-'+savedTheme)) b.classList.add('active');
});

// ===================== بدء التشغيل =====================
buildAllSections();
loadVoices();
setTimeout(loadVoices, 300);
setTimeout(loadVoices, 1000);
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
</script>
