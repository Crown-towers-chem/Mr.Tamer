        {en: "The crowd cheered, and Edmond felt as if the whole world celebrated with him. Yet, while most smiled, not every face was full of joy. Hidden among the crowd was Fernand Mondego, a fisherman from Catalonia. He stood silently, his fists clenched, his eyes burning with jealousy. For Fernand loved Mercédès too, and he had long dreamed of marrying her. But she had chosen Edmond, and Fernand's heart was filled with anger and envy.", ar: "هتف الحشد، وشعر إدموند وكأن العالم كله يحتفل معه. ومع ذلك، بينما ابتسم معظمهم، لم يكن كل وجه مليئاً بالفرح. كان فيرناند مونديغو، صياد من كتالونيا، مختبئاً بين الحشد. وقف بصمت، وقبضت يداه، وعيناه تحترقان بالغيرة. لأن فيرناند أحب مرسيدس أيضاً، وكان يحلم منذ زمن طويل بالزواج منها. لكنها اختارت إدموند، وامتلأ قلب فيرناند بالغضب والحسد."},
        {en: "Another man, Danglars, the ship's purser, also looked at Edmond with bitterness. During the voyage, Edmond had been promoted above him, and Danglars could not forgive this humiliation. To see a nineteen-year-old boy given the command of the Pharaon was, for him, an insult. His lips curled into a thin smile as he muttered to himself, 'Captain Dantès... we shall see how long that lasts.'", ar: "رجل آخر، دانغلار، أمين صندوق السفينة، نظر أيضاً إلى إدموند بمرارة. خلال الرحلة، تم ترقية إدموند فوقه، ولم يستطع دانغلار أن يغفر هذه الإهانة. إن رؤية صبي في التاسعة عشر من عمره يُمنح قيادة الفرعون كانت، بالنسبة له، إهانة. انثنت شفتاه في ابتسامة رفيعة وهو يتمتم في نفسه، 'القبطان دانتيس... سنرى إلى متى سيستمر ذلك.'"},
        {en: "Unaware of the hatred growing around him, Edmond walked proudly through the streets of Marseille with his father and Mercédès at his side. They visited his father's small home, where Edmond discovered a painful truth: his father had lived in poverty while he was away. Out of duty, the old man had repaid a debt of money that Edmond owed to a neighbor, leaving himself almost nothing to eat. Edmond was heartbroken, but he quickly gave his father all the wages he had earned. 'From now on, you will want for nothing,' he promised.", ar: "غير مدرك للكراهية المتنامية من حوله، مشى إدموند بفخر في شوارع مرسيليا مع والده ومرسيدس بجانبه. زاروا منزل والده الصغير، حيث اكتشف إدموند حقيقة مؤلمة: كان والده يعيش في فقر أثناء غيابه. بدافع الواجب، كان الرجل العجوز قد سدد ديناً مالياً يدين به إدموند لجار، تاركاً لنفسه بالكاد أي شيء ليأكله. انكسر قلب إدموند، لكنه سرعان ما أعطى والده كل الأجور التي كسبها. 'من الآن فصاعداً، لن تفتقر إلى أي شيء'، وعد."},
        {en: "The evening brought more joy. Edmond and Mercédès walked along the shore, speaking of their future. The sea breeze touched their faces, and the horizon seemed to promise endless possibilities.", ar: "جلب المساء المزيد من الفرح. سار إدموند ومرسيدس على طول الشاطئ، يتحدثان عن مستقبلهما. لمس نسيم البحر وجوههما، وبدا الأفق وكأنه يعد بإمكانيات لا نهاية لها."},
        {en: "They planned to marry as soon as possible. Mercédès leaned on Edmond's arm and whispered, 'I wish this happiness could last forever.'", ar: "خططا للزواج في أقرب وقت ممكن. استندت مرسيدس على ذراع إدموند وهمست، 'أتمنى أن تستمر هذه السعادة إلى الأبد.'"},
        {en: "'It will,' Edmond answered confidently. 'Nothing can take it from us.'", ar: "'سيكون'، أجاب إدموند بثقة. 'لا شيء يمكن أن يأخذها منا.'"},
        {en: "But fate had other plans.", ar: "لكن القدر كان له خطط أخرى."},
        {en: "The Seeds of Betrayal", ar: "بذور الخيانة"},
        {en: "While Edmond celebrated, Danglars and Fernand met secretly in a dark tavern. They spoke in low voices, their words heavy with malice.", ar: "بينما كان إدموند يحتفل، التقى دانغلار وفيرناند سراً في حانة مظلمة. تحدثوا بأصوات خافتة، وكانت كلماتهم ثقيلة بالحقد."},
        {en: "'Edmond has everything!' Fernand hissed. 'Mercédès, success, the captaincy. While I—who have loved her since childhood—am left with nothing.'", ar: "'إدموند لديه كل شيء!' أزيز فيرناند. 'مرسيدس، النجاح، القيادة. بينما أنا - الذي أحبها منذ الطفولة - بقيت بلا شيء.'"},
        {en: "'And I,' said Danglars, 'should be purser, second only to the captain. Instead, this boy takes the command, and I am forced to serve under him. His good fortune is insufferable.'", ar: "'وأنا'، قال دانغلار، 'يجب أن أكون أمين الصندوق، الثاني فقط بعد القبطان. بدلاً من ذلك، يأخذ هذا الصبي القيادة، وأنا مجبر على الخدمة تحت قيادته. حظه السعيد لا يطاق.'"},
        {en: "The two men drank coffee, their eyes filled with hatred. It was then that Danglars suggested a plan. 'What if Edmond were accused of being a traitor? What if someone wrote a letter to the authorities, claiming he carries messages from Napoleon's supporters?'", ar: "شرب الرجلان القهوة، وعيونهما مليئة بالكراهية. عندها اقترح دانغلار خطة. 'ماذا لو اتُهم إدموند بأنه خائن؟ ماذا لو كتب شخص ما رسالة إلى السلطات، زاعماً أنه يحمل رسائل من أنصار نابليون؟'"},
        {en: "Fernand's eyes lit with cruel hope. 'If he is arrested, he will lose Mercédès. She will be mine.'", ar: "أضاءت عينا فيرناند بالأمل القاسي. 'إذا تم اعتقاله، سيخسر مرسيدس. ستكون لي.'"},
        {en: "'Exactly,' Danglars agreed. 'And I shall have my revenge. He will never be captain if he is in prison.'", ar: "'بالضبط'، وافق دانغلار. 'وسآخذ ثأري. لن يكون قبطاناً أبداً إذا كان في السجن.'"},
        {en: "That night, with careful handwriting, Danglars composed a letter. It accused Edmond Dantès of carrying a secret letter from Napoleon Bonaparte to his followers in Paris. The accusation was false, but it was dangerous. The government feared Napoleon, who had been exiled but still had many loyal supporters. To be suspected of helping him was enough to destroy a man's life.", ar: "في تلك الليلة، بخط يد دقيق، كتب دانغلار رسالة. اتهمت إدموند دانتيس بحمل رسالة سرية من نابليون بونابرت إلى أتباعه في باريس. كان الاتهام كاذباً، لكنه كان خطيراً. كانت الحكومة تخشى نابليون، الذي نُفي لكنه لا يزال لديه العديد من المؤيدين المخلصين. كان الشك في مساعدته كافياً لتدمير حياة رجل."},
        {en: "When the letter was finished, Fernand delivered it to the local prosecutor. With that single act, Edmond's future was poisoned.", ar: "عندما انتهت الرسالة، سلمها فيرناند إلى المدعي العام المحلي. بهذا الفعل الوحيد، تسمم مستقبل إدموند."},
        {en: "Celebration and Shadows", ar: "الاحتفال والظلال"},
        {en: "The next day, Edmond's friends gathered for his betrothal feast. Laughter filled the air, music played, and tables were heavy with food and drinks. Mercédès wore a simple white dress, her face glowing with happiness.", ar: "في اليوم التالي، تجمع أصدقاء إدموند لحفل خطوبته. ملأ الضحك الهواء، وعزفت الموسيقى، وكانت الطاولات مليئة بالطعام والشراب. ارتدت مرسيدس فستاناً أبيض بسيطاً، ووجهها يضيء بالسعادة."},
        {en: "Cheers answered him, and for a moment, all seemed perfect.", ar: "أجابته الهتافات، ولحظة من الزمن، بدا كل شيء مثاليًا."},
        {en: "But outside, in the shadows, soldiers approached. At the height of the celebration, the door opened, and an officer entered with cold authority.", ar: "ولكن في الخارج، في الظل، اقترب الجنود. في ذروة الاحتفال، فُتح الباب، ودخل ضابط بسلطة باردة."},
        {en: "'Edmond Dantès?' he asked.", ar: "'إدموند دانتيس؟' سأل."},
        {en: "'Yes,' Edmond replied, surprised.", ar: "'نعم'، أجاب إدموند متفاجئاً."},
        {en: "'You are under arrest by the order of the king's prosecutor.'", ar: "'أنت قيد الاعتقال بأمر من مدعي عام الملك.'"},
        {en: "The room fell silent. Mercédès gasped, Edmond's father trembled, and Edmond himself stood frozen with shock. He had done nothing wrong, yet strong hands seized him and led him away.", ar: "ساد الصمت في الغرفة. شهقت مرسيدس، وارتعد والد إدموند، ووقف إدموند نفسه متجمداً من الصدمة. لم يرتكب أي خطأ، ومع ذلك أمسكته أيدٍ قوية وقادوه بعيداً."},
        {en: "The feast ended in confusion and sorrow. Mercédès cried out, 'There must be a mistake! Edmond is innocent!' But her words were useless. The trap had closed, and Edmond's bright future was already slipping into darkness.", ar: "انتهى العيد في حيرة وحزن. صرخت مرسيدس، 'لا بد أن هناك خطأ! إدموند بريء!' لكن كلماتها كانت عديمة الجدوى. كان الفخ قد أغلق، ومستقبل إدموند المشرق كان ينزلق بالفعل إلى الظلام."}
    ]
}
];

// ===================== بناء الواجهة =====================
function makeWordSpans(text) {
    const words = text.trim().split(/\s+/);
    return words.map((w, idx) => `<span class="word" data-word-index="${idx}">${w}</span>`).join(' ');
}

function buildAllSections() {
    const container = document.getElementById('sections-container');

    function makePills(wordsArray, sectionId) {
        return wordsArray.map((w, i) => {
            const id = `${sectionId}_p${i}`;
            const wordHtml = makeWordSpans(w[0]);
            const speakText = cleanForSpeech(w[0]);
            return `<div class="pill" id="${id}" data-speak="${speakText}" onclick="playOne('${id}')"><span class="en">${wordHtml}</span><span class="tr">${w[1]}</span></div>`;
        }).join('');
    }

    function makeRuleItem(icon, sectionId, index, speakText, arText, displayText) {
        const id = `${sectionId}_${index}`;
        const wordHtml = makeWordSpans(displayText || speakText);
        const finalSpeak = cleanForSpeech(speakText);
        return `<div class="rule-item" id="${id}" data-speak="${finalSpeak}" onclick="playOne('${id}')">
            <span class="rule-icon">${icon}</span>
            <div class="rule-text">
                <span class="en">${wordHtml}</span>
                <span class="ar">${arText || ''}</span>
            </div>
        </div>`;
    }

    function playBar(sectionId) {
        return `<div class="sec-play-bar">
            <button class="big-btn" style="background:linear-gradient(135deg,var(--A),var(--A2))" onclick="playSection('${sectionId}')">▶ Play</button>
            <button class="big-btn pause-btn" onclick="pauseAll()">⏸ Pause</button>
            <button class="big-btn stop-btn" onclick="stopAll()">⏹ Stop</button>
        </div>`;
    }

    function isSubHeading(text) {
        // Short standalone lines with no ending punctuation are treated as section headings
        return text.trim().split(/\s+/).length <= 5 && !/[.!?']$/.test(text.trim());
    }

    function makeStorySection(sectionId, storyData) {
        return `<div class="story-card">
            ${storyData.map((s, i) => {
                const id = `${sectionId}_s${i}`;
                const heading = isSubHeading(s.en);
                const wordHtml = makeWordSpans(s.en);
                const cls = heading ? 'sentence sub-heading' : 'sentence';
                return `<div class="${cls}" id="${id}" data-speak="${cleanForSpeech(s.en)}" onclick="playOne('${id}')">${wordHtml}</div>`;
            }).join('')}
            <div class="story-ar">${storyData.map(s => s.ar).join(' ')}</div>
        </div>`;
    }

    let html = '';

    chaptersData.forEach(ch => {
        const vocabId = `secVocabCh${ch.number}`;
        const defId = `secDefCh${ch.number}`;

        // Chapter divider
        html += `<div class="chapter-divider"><h2>Chapter ${ch.number}</h2><p>${ch.title}</p></div>`;

        // Vocabulary section
        html += `<div class="section-block" id="${vocabId}">
            <div class="sec-title">📚 Vocabulary — Chapter ${ch.number}</div>
            <div class="sec-body">
                ${playBar(vocabId)}
                <div class="info-box">
                    <div class="info-title">Key Vocabulary</div>
                    <div class="vocab">${makePills(ch.vocab, vocabId)}</div>
                </div>
            </div>
        </div>`;

        // Definitions section
        html += `<div class="section-block" id="${defId}">
            <div class="sec-title">📝 Definitions — Chapter ${ch.number}</div>
            <div class="sec-body">
                ${playBar(defId)}
                <div class="rules-grid">${ch.definitions.map((d, i) => {
                    const speakText = cleanForSpeech(d.word) + " | " + d.def;
                    return makeRuleItem('📖', defId, i, speakText, d.def, d.word);
                }).join('')}</div>
            </div>
        </div>`;

        // Story text section (only if this chapter has story data)
        if (ch.story && ch.story.length > 0) {
            const storyId = `secStoryCh${ch.number}`;
            html += `<div class="section-block" id="${storyId}">
                <div class="sec-title">📖 Reading Text — Chapter ${ch.number}</div>
                <div class="sec-body">
                    ${playBar(storyId)}
                    ${makeStorySection(storyId, ch.story)}
                </div>
            </div>`;
        }
    });

    container.innerHTML = html;
}

// ===================== نظام الصوت =====================
const rateRange = document.getElementById('rateRange');
const rateBadge = document.getElementById('rateBadge');
const fabPause = document.getElementById('fabPause');

const savedRate = localStorage.getItem('speechRate') || 1;
rateRange.value = savedRate;
rateBadge.textContent = parseFloat(savedRate).toFixed(1)+'x';
rateRange.addEventListener('input', () => {
    const val = parseFloat(rateRange.value).toFixed(1);
    rateBadge.textContent = val+'x';
    localStorage.setItem('speechRate', val);
});

let voices = [];
function loadVoices() {
    voices = window.speechSynthesis.getVoices();
    populateVoiceSelect();
}
function populateVoiceSelect() {
    const vs = document.getElementById('voiceSelect');
    const note = document.getElementById('voiceNote');
    const allVoices = voices;
    if (!allVoices.length) return;
    const normalizeLang = (lang) => lang.replace('_', '-');
    const isLangMatch = (voiceLang, targetPrefix) => normalizeLang(voiceLang) === targetPrefix || normalizeLang(voiceLang).startsWith(targetPrefix + '-');
    const usVoice = allVoices.find(v => isLangMatch(v.lang, 'en-US'));
    const gbVoice = allVoices.find(v => isLangMatch(v.lang, 'en-GB'));
    const options = [];
    if (usVoice) options.push({ label: '🇺🇸 American', uri: usVoice.voiceURI });
    if (gbVoice) options.push({ label: '🇬🇧 British', uri: gbVoice.voiceURI });
    if (!options.length) {
        note.textContent = '⚠️ No US/UK voice found.';
        const anyEn = allVoices.filter(v => v.lang.startsWith('en')).slice(0,2);
        anyEn.forEach(v => options.push({ label: v.name + ' ('+v.lang+')', uri: v.voiceURI }));
    } else {
        note.textContent = '';
    }
    const savedURI = localStorage.getItem('voiceURI');
    vs.innerHTML = options.map(o => `<option value="${o.uri}">${o.label}</option>`).join('');
    if (savedURI && options.some(o => o.uri === savedURI)) vs.value = savedURI;
}
document.getElementById('voiceSelect').addEventListener('change', function() {
    localStorage.setItem('voiceURI', this.value);
});

function getSelectedVoice() {
    const uri = localStorage.getItem('voiceURI');
    return voices.find(v => v.voiceURI === uri) || null;
}

window._q = []; window._qi = 0;
window._currentUtterance = null;
let currentHighlightedId = null;

function clearAllHighlights() {
    document.querySelectorAll('.active-sent').forEach(e => e.classList.remove('active-sent'));
    currentHighlightedId = null;
}
function showFab(show) { if (show) fabPause.classList.add('show'); else fabPause.classList.remove('show'); }
function updateFabIcon() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) fabPause.innerHTML = '⏸️';
    else if (window.speechSynthesis.paused) fabPause.innerHTML = '▶️';
    else fabPause.innerHTML = '⏯️';
}

function playQueue() {
    if (window._qi >= window._q.length) {
        clearAllHighlights(); showFab(false); return;
    }
    const item = window._q[window._qi];
    if (currentHighlightedId !== item.id) {
        clearAllHighlights();
        const el = document.getElementById(item.id);
        if (el) {
            el.classList.add('active-sent');
            el.scrollIntoView({behavior:'smooth',block:'nearest'});
            currentHighlightedId = item.id;
        }
    }
    const u = new SpeechSynthesisUtterance(item.text);
    u.rate = parseFloat(rateRange.value) || 1;
    const voice = getSelectedVoice();
    if (voice) u.voice = voice;

    u.onstart = () => { showFab(true); updateFabIcon(); };
    u.onend = function() { window._qi++; playQueue(); };
    u.onerror = function(e) { console.warn('Speech error', e); window._qi++; playQueue(); };
    u.onpause = () => updateFabIcon();
    u.onresume = () => updateFabIcon();

    window._currentUtterance = u;
    window.speechSynthesis.speak(u);
}

function splitAndQueue(textParts, id) {
    textParts.forEach((p) => { const trimmed = p.trim(); if (trimmed) window._q.push({id: id, text: trimmed}); });
}

function playSection(secId) {
    stopAll();
    const sec = document.getElementById(secId);
    const els = [...sec.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        const text = el.dataset.speak;
        const parts = text.split('|').map(p => p.trim());
        splitAndQueue(parts, el.id);
    });
    window._qi = 0;
    playQueue();
}

function playAll() {
    stopAll();
    const els = [...document.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        const text = el.dataset.speak;
        const parts = text.split('|').map(p => p.trim());
        splitAndQueue(parts, el.id);
    });
    window._qi = 0;
    playQueue();
}

function playOne(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const text = el.dataset.speak;
    stopAll();
    const parts = text.split('|').map(p => p.trim());
    splitAndQueue(parts, id);
    window._qi = 0;
    playQueue();
}

function pauseAll() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
        window.speechSynthesis.pause(); updateFabIcon();
    } else if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume(); updateFabIcon();
    }
}

function stopAll() {
    window._q = []; window._qi = 0;
    clearAllHighlights();
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    showFab(false);
}

function toggleFabPause() { pauseAll(); }

// ===================== الثيمات =====================
function setTheme(theme, btn) {
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    localStorage.setItem('theme', theme);
}
const savedTheme = localStorage.getItem('theme') || 'teal';
document.documentElement.setAttribute('data-theme', savedTheme);
document.querySelectorAll('.theme-btn').forEach(b => {
    if (b.classList.contains('t-'+savedTheme)) b.classList.add('active');
});

// ===================== بدء التشغيل =====================
buildAllSections();
loadVoices();
setTimeout(loadVoices, 300);
setTimeout(loadVoices, 1000);
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
</script>
