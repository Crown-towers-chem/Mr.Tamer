    {en: "Notably, the majority of the world's megacities are situated in coastal areas, including several major European urban centers facing significant flood risks.", ar: "ومن الجدير بالذكر أن غالبية المدن العملاقة في العالم تقع في مناطق ساحلية، بما في ذلك العديد من المراكز الحضرية الأوروبية الكبرى التي تواجه مخاطر فيضانات كبيرة."},
    {en: "Climate migration and large-scale population shifts are expected in the coming decades. While international climate agreements aim to mitigate greenhouse gas emissions, their potential to slow sea level rise remains uncertain.", ar: "من المتوقع حدوث هجرة مناخية وتحولات سكانية واسعة النطاق في العقود القادمة. وبينما تهدف الاتفاقيات المناخية الدولية إلى تخفيف انبعاثات غازات الدفيئة، تظل قدرتها المحتملة على إبطاء ارتفاع مستوى سطح البحر غير مؤكدة."},
    {en: "Consequently, adaptation strategies are becoming increasingly critical. Innovative engineering solutions, such as amphibious architecture and large-scale coastal defense systems, are being implemented in flood-prone regions.", ar: "وبالتالي، أصبحت استراتيجيات التكيف ذات أهمية متزايدة. يتم تنفيذ حلول هندسية مبتكرة، مثل الهندسة المعمارية البرمائية وأنظمة الدفاع الساحلية واسعة النطاق، في المناطق المعرضة للفيضانات."},
    {en: "These measures demonstrate the growing recognition that both modification and adaptation will be essential to address this pressing global challenge.", ar: "توضح هذه التدابير الاعتراف المتزايد بأن كلاً من التعديل والتكيف سيكونان ضروريين لمعالجة هذا التحدي العالمي الملح."}
];

// ===================== بناء الواجهة =====================
function makeWordSpans(text) {
    const words = text.trim().split(/\s+/);
    return words.map((w, idx) => `<span class="word" data-word-index="${idx}">${w}</span>`).join(' ');
}

function buildAllSections() {
    const container = document.getElementById('sections-container');

    function makePills(wordsArray, sectionId) {
        return wordsArray.map((w, i) => {
            const id = `${sectionId}_p${i}`;
            const wordHtml = makeWordSpans(w[0]);
            const speakText = cleanForSpeech(w[0]);
            return `<div class="pill" id="${id}" data-speak="${speakText}" onclick="playOne('${id}')"><span class="en">${wordHtml}</span><span class="tr">${w[1]}</span></div>`;
        }).join('');
    }

    function makeRuleItem(icon, sectionId, index, speakText, arText, displayText) {
        const id = `${sectionId}_${index}`;
        const wordHtml = makeWordSpans(displayText || speakText);
        const finalSpeak = cleanForSpeech(speakText);
        return `<div class="rule-item" id="${id}" data-speak="${finalSpeak}" onclick="playOne('${id}')">
            <span class="rule-icon">${icon}</span>
            <div class="rule-text">
                <span class="en">${wordHtml}</span>
                <span class="ar">${arText || ''}</span>
            </div>
        </div>`;
    }

    function playBar(sectionId) {
        return `<div class="sec-play-bar">
            <button class="big-btn" style="background:linear-gradient(135deg,var(--A),var(--A2))" onclick="playSection('${sectionId}')">▶ Play</button>
            <button class="big-btn pause-btn" onclick="pauseAll()">⏸ Pause</button>
            <button class="big-btn stop-btn" onclick="stopAll()">⏹ Stop</button>
        </div>`;
    }

    function makeStorySection(title, storyData) {
        return `<div class="story-card">
            <div style="font-weight:bold;color:var(--A);margin-bottom:12px;">${title}</div>
            ${storyData.map((s,i) => {
                const id = `secStory_${title.replace(/\s/g,'')}_${i}`;
                let enText = s.en;
                let speaker = '';
                let dialogueText = enText;
                const colonIndex = enText.indexOf(': ');
                if (colonIndex > 0) {
                    speaker = enText.substring(0, colonIndex);
                    dialogueText = enText.substring(colonIndex + 2);
                }
                const emoji = speaker ? '💬' : '📖';
                const wordHtml = makeWordSpans(dialogueText);
                let speakerHtml = '';
                if (speaker) {
                    speakerHtml = `<span class="speaker-label">${emoji} ${speaker}</span> `;
                }
                return `<div class="sentence" id="${id}" data-speak="${s.en}" onclick="playOne('${id}')">
                    ${speakerHtml} ${wordHtml}
                </div> `;
            }).join('')}
            <div class="story-ar">${storyData.map(s => s.ar).join(' ')}</div>
        </div>`;
    }

    const sections = [];

    // 1. Key Vocabulary
    if (keyVocab && keyVocab.length > 0) {
        sections.push({ title:"💊 Key Vocabulary", id:"secKeyVocab", content: `<div class="info-box"><div class="info-title">Key Vocabulary (Lessons 4 & 5)</div><div class="vocab">${makePills(keyVocab, "secKeyVocab")}</div></div>` });
    }

    // 2. Accumulative Vocabulary
    if (accVocab && accVocab.length > 0) {
        sections.push({ title:"📚 Accumulative Vocabulary", id:"secAccVocab", content: `<div class="info-box"><div class="info-title">Accumulative Vocabulary</div><div class="vocab">${makePills(accVocab, "secAccVocab")}</div></div>` });
    }

    // 3. Definitions
    if (defsData && defsData.length > 0) {
        sections.push({ title:"📝 Definitions", id:"secDefs", content: `<div class="rules-grid">${defsData.map((d,i) => {
            const speakText = cleanForSpeech(d.word) + " | " + d.def;
            return makeRuleItem('📖', 'secDefs', i, speakText, d.def, d.word);
        }).join('')}</div>` });
    }

    // 4. Synonyms & Antonyms
    if (synData && synData.length > 0) {
        sections.push({ title:"🔄 Synonyms", id:"secSyn", content: `<div class="rules-grid">${synData.map((s,i) => makeRuleItem('↔️', 'secSyn', i, s.word + " | " + s.syn, s.syn, s.word)).join('')}</div>` });
    }
    if (antData && antData.length > 0) {
        sections.push({ title:"🚫 Antonyms", id:"secAnt", content: `<div class="rules-grid">${antData.map((a,i) => makeRuleItem('🛑', 'secAnt', i, a.word + " | " + a.ant, a.ant, a.word)).join('')}</div>` });
    }

    // 5. Collocations
    if (collocationsData && collocationsData.length > 0) {
        sections.push({ title:"🔗 Collocations", id:"secCollocations", content: `<div class="rules-grid">${collocationsData.map((c,i) => makeRuleItem('🔗', 'secCollocations', i, c[0], c[1], c[0])).join('')}</div>` });
    }

    // 6. Expressions & Prepositions
    if (exprData && exprData.length > 0) {
        sections.push({ title:"💬 Expressions & Prepositions", id:"secExpr", content: `<div class="rules-grid">${exprData.map((e,i) => makeRuleItem('💡', 'secExpr', i, e[0], e[1], e[0])).join('')}</div>` });
    }

    // 7. Verb + Prepositions
    if (phrasalVerbsData && phrasalVerbsData.length > 0) {
        sections.push({ title:"⚡ Verb + Prepositions", id:"secPhrasal", content: `<div class="rules-grid">${phrasalVerbsData.map((p,i) => makeRuleItem('⚡', 'secPhrasal', i, p[0], p[1], p[0])).join('')}</div>` });
    }

    // 8. Derivatives
    if (derivativesData && derivativesData.length > 0) {
        sections.push({ title:"🔨 Derivatives (Word Families)", id:"secDerivatives", content: `<div class="rules-grid">${derivativesData.map((d,i) => {
            const formsStr = d.forms.join(" | ");
            const speakText = `${d.word} | ${formsStr}`;
            const displayText = `${d.word} → ${formsStr}`;
            return makeRuleItem('🔨', 'secDerivatives', i, speakText, d.ex, displayText);
        }).join('')}</div>` });
    }

    // 9. Clear the Confusion
    if (confusionData && confusionData.length > 0) {
        sections.push({ title:"🧐 Clear the Confusion", id:"secConfusion", content: `<div class="rules-grid">${confusionData.map((c,i) => {
            const speakText = `${c.word} | ${c.forms}`;
            const displayText = `${c.word} : ${c.forms}`;
            return makeRuleItem('🧐', 'secConfusion', i, speakText, c.ex, displayText);
        }).join('')}</div>` });
    }

    // 10. Reading Text (Lesson 4)
    if (readingTextL4 && readingTextL4.length > 0) {
        sections.push({ title:"📖 Reading Text (Lesson 4)", id:"secReadL4", content: makeStorySection("Global Climate", readingTextL4) });
    }

    // 11. Reading Text (Lesson 5)
    if (readingTextL5 && readingTextL5.length > 0) {
        sections.push({ title:"📖 Reading Text (Lesson 5)", id:"secReadL5", content: makeStorySection("How to Help Our Environment", readingTextL5) });
    }

    let html = '';
    sections.forEach(sec => {
        html += `<div class="section-block" id="${sec.id}">
            <div class="sec-title">${sec.title}</div>
            <div class="sec-body">
                ${playBar(sec.id)}
                ${sec.content}
            </div>
        </div>`;
    });
    container.innerHTML = html;
}

// ===================== نظام الصوت =====================
const rateRange = document.getElementById('rateRange');
const rateBadge = document.getElementById('rateBadge');
const fabPause = document.getElementById('fabPause');

const savedRate = localStorage.getItem('speechRate') || 1;
rateRange.value = savedRate;
rateBadge.textContent = parseFloat(savedRate).toFixed(1)+'x';
rateRange.addEventListener('input', () => {
    const val = parseFloat(rateRange.value).toFixed(1);
    rateBadge.textContent = val+'x';
    localStorage.setItem('speechRate', val);
});

let voices = [];
function loadVoices() {
    voices = window.speechSynthesis.getVoices();
    populateVoiceSelect();
}
function populateVoiceSelect() {
    const vs = document.getElementById('voiceSelect');
    const note = document.getElementById('voiceNote');
    const allVoices = voices;
    if (!allVoices.length) return;
    const normalizeLang = (lang) => lang.replace('_', '-');
    const isLangMatch = (voiceLang, targetPrefix) => normalizeLang(voiceLang) === targetPrefix || normalizeLang(voiceLang).startsWith(targetPrefix + '-');
    const usVoice = allVoices.find(v => isLangMatch(v.lang, 'en-US'));
    const gbVoice = allVoices.find(v => isLangMatch(v.lang, 'en-GB'));
    const options = [];
    if (usVoice) options.push({ label: '🇺🇸 American', uri: usVoice.voiceURI });
    if (gbVoice) options.push({ label: '🇬🇧 British', uri: gbVoice.voiceURI });
    if (!options.length) {
        note.textContent = '⚠️ No US/UK voice found.';
        const anyEn = allVoices.filter(v => v.lang.startsWith('en')).slice(0,2);
        anyEn.forEach(v => options.push({ label: v.name + ' ('+v.lang+')', uri: v.voiceURI }));
    } else {
        note.textContent = '';
    }
    const savedURI = localStorage.getItem('voiceURI');
    vs.innerHTML = options.map(o => `<option value="${o.uri}">${o.label}</option>`).join('');
    if (savedURI && options.some(o => o.uri === savedURI)) vs.value = savedURI;
}
document.getElementById('voiceSelect').addEventListener('change', function() {
    localStorage.setItem('voiceURI', this.value);
});

function getSelectedVoice() {
    const uri = localStorage.getItem('voiceURI');
    return voices.find(v => v.voiceURI === uri) || null;
}

window._q = []; window._qi = 0;
window._currentUtterance = null;
let currentHighlightedId = null;

function clearAllHighlights() {
    document.querySelectorAll('.active-sent').forEach(e => e.classList.remove('active-sent'));
    currentHighlightedId = null;
}
function showFab(show) { if (show) fabPause.classList.add('show'); else fabPause.classList.remove('show'); }
function updateFabIcon() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) fabPause.innerHTML = '⏸️';
    else if (window.speechSynthesis.paused) fabPause.innerHTML = '▶️';
    else fabPause.innerHTML = '⏯️';
}

function playQueue() {
    if (window._qi >= window._q.length) {
        clearAllHighlights(); showFab(false); return;
    }
    const item = window._q[window._qi];
    if (currentHighlightedId !== item.id) {
        clearAllHighlights();
        const el = document.getElementById(item.id);
        if (el) {
            el.classList.add('active-sent');
            el.scrollIntoView({behavior:'smooth',block:'nearest'});
            currentHighlightedId = item.id;
        }
    }
    const u = new SpeechSynthesisUtterance(item.text);
    u.rate = parseFloat(rateRange.value) || 1;
    const voice = getSelectedVoice();
    if (voice) u.voice = voice;

    u.onstart = () => { showFab(true); updateFabIcon(); };
    u.onend = function() { window._qi++; playQueue(); };
    u.onerror = function(e) { console.warn('Speech error', e); window._qi++; playQueue(); };
    u.onpause = () => updateFabIcon();
    u.onresume = () => updateFabIcon();

    window._currentUtterance = u;
    window.speechSynthesis.speak(u);
}

function splitAndQueue(textParts, id) {
    textParts.forEach((p) => { const trimmed = p.trim(); if (trimmed) window._q.push({id: id, text: trimmed}); });
}

function playSection(secId) {
    stopAll();
    const sec = document.getElementById(secId);
    const els = [...sec.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        const text = el.dataset.speak;
        const parts = text.split('|').map(p => p.trim());
        splitAndQueue(parts, el.id);
    });
    window._qi = 0;
    playQueue();
}

function playAll() {
    stopAll();
    const els = [...document.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        const text = el.dataset.speak;
        const parts = text.split('|').map(p => p.trim());
        splitAndQueue(parts, el.id);
    });
    window._qi = 0;
    playQueue();
}

function playOne(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const text = el.dataset.speak;
    stopAll();
    const parts = text.split('|').map(p => p.trim());
    splitAndQueue(parts, id);
    window._qi = 0;
    playQueue();
}

function pauseAll() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
        window.speechSynthesis.pause(); updateFabIcon();
    } else if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume(); updateFabIcon();
    }
}

function stopAll() {
    window._q = []; window._qi = 0;
    clearAllHighlights();
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    showFab(false);
}

function toggleFabPause() { pauseAll(); }

// ===================== الثيمات =====================
function setTheme(theme, btn) {
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    localStorage.setItem('theme', theme);
}
const savedTheme = localStorage.getItem('theme') || 'teal';
document.documentElement.setAttribute('data-theme', savedTheme);
document.querySelectorAll('.theme-btn').forEach(b => {
    if (b.classList.contains('t-'+savedTheme)) b.classList.add('active');
});

// ===================== بدء التشغيل =====================
buildAllSections();
loadVoices();
setTimeout(loadVoices, 300);
setTimeout(loadVoices, 1000);
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
</script>
